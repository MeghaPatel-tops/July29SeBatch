<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            background-image: url(pahdo.webp);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form1{
           box-shadow: 2px 2px 5px 5px white;
            padding: 20px 30px;
            border-radius: 20px;
        }
        .form1 h1{
            color: blue;
        }
        .form-control{
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }
        .form-control label{
            color: rgb(58, 55, 55);
            font-size: 1em;
            font-weight: bolder;
        }
        .form-control input{
            padding: 10px;
            border-radius: 20px;
            border: none;
            background-color: transparent;
             border-bottom: 2px solid white;
           
        }
         .form-control input:hover, .form-control input:focus{
              border: 2px solid white;
              outline: none;
         }
        .form-control button{
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="form1">
            <h1>User Registration Form</h1>
             <form action="">
                 <div class="form-control">
                <label for="">Enter Your Name</label>
                <input type="text" name="" id="">
            </div>
            <div class="form-control">
                <label for="">Enter Your Email</label>
                <input type="text" name="" id="">
            </div>
              <div class="form-control">
                <label for="">Enter Your Contact</label>
                <input type="text" name="" id="">
            </div>
             <div class="form-control">
               <div><button>Submit</button></div>
                
            </div>
             </form>
            
        </div>
    </div>
</body>
</html>
