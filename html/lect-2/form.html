<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Form Example</h1>
    <table align="center" border="1"  cellpadding="10px" cellspacing="10px">
        <form method="post">
            <tr>
                <th>Enter your name</th>
                <td>
                    <input type="text" name="" id="" placeholder="Enter name" required>
                </td>
                <th>Enter your Email</th>
                <td>
                    <input type="email" name="" id="">
                </td>
            </tr>
            <tr>
                <th>Password</th>
                <td><input type="password" name="pwd" id="" required minlength="8"></td>
                <th>DOB</th>
                <td><input type="date" name="" id=""></td>
            </tr>
            <tr>
                <th>Hobby</th>
                <td>
                    <input type="checkbox" name="" id="">Music
                    <input type="checkbox" name="" id="">Dance
                    <input type="checkbox" name="" id="">Sports
                </td>
                <th>
                    Gender
                </th>
                <td>
                    <input type="radio" name="gender" id="">Male
                    <input type="radio" name="gender" id="">Female
                </td>
            </tr>
            <tr>
                <th>Address</th>
                <td><textarea name="" id=""></textarea></td>
                <th>city</th>
                <td>
                    <select name="" id="">
                        <option value="">select</option>
                        <option value="">Surat</option>
                        <option value="">Vadodra</option>
                        <option value="">Vapi</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="4" align="center"><input type="submit" value="Submit"></td>
            </tr>
        </form>
    </table>
</body>
</html>
